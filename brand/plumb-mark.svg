<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-label="Plumb">
  <!-- The fixed point it hangs from. Everything below is decided by gravity, not by taste. -->
  <path d="M6 3h12"/>
  <!-- The line. Dead straight, because that is the entire claim. -->
  <path d="M12 3v10"/>
  <!-- The bob: a shoulder, then a point. It ends in a single pixel — the measurement is exact
       or it is nothing. -->
  <path d="M12 13l3.2 3.4L12 21l-3.2-4.6L12 13z"/>
</svg>
