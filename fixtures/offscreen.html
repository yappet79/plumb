<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fixture — offscreen</title>
<!-- Frame is 1600 wide; check it at 1200 and it must fire. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1600px; background: #F4F6F8;
         font: 16px/1.4 Arial, sans-serif; color: #111827; }
  .frame { position: relative; width: 1600px; height: 800px;
           padding: 40px; overflow: hidden; background: #F4F6F8; }
  .card { padding: 20px; background: #fff; border: 1px solid #E2E8F0; border-radius: 10px; }
  .frame { width: 1600px; }
  body { width: 1600px; }
</style>
</head>
<body>
  <div class="frame">
    <div class="card"><h2>Too wide</h2><p>The frame itself does not fit the viewport.</p></div>
  </div>
</body>
</html>
